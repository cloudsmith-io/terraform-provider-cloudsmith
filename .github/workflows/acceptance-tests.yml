name: Acceptance
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  generate:
    name: Generate tests
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
        id: go
      - name: Create test batches
        id: list
        run: |
          #!/usr/bin/env bash
          tests=$(go test -list '^Test' -json ./... | \
          jq -nc '[inputs | select((.Output // "")
          | startswith("Test"))
          | {pkg: .Package, test: (.Output | rtrimstr("\n"))}]')
          echo tests="$tests" > "$GITHUB_OUTPUT"
      - name: Compile test binary
        id: compile
        run: go test -c -o cloudsmith.test ./cloudsmith
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.1.0 
        with:
          name: testbin
          path: cloudsmith.test
  test:
    concurrency:
      group: acceptance-tests
      cancel-in-progress: false
      queue: max
    needs: generate
    runs-on: ubuntu-slim
    name: ${{ matrix.test }}
    strategy:
      fail-fast: false # don't cancel siblings when one flakes
      max-parallel: 32
      matrix:
        include: ${{ fromJSON(needs.generate.outputs.tests) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: testbin
      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - run: chmod +x cloudsmith.test
      - run: TF_ACC=1 TF_ACC_TERRAFORM_PATH=$(which terraform) ./cloudsmith.test -test.v -test.run '^${{ matrix.test }}$'
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CLOUDSMITH_NAMESPACE: terraform-provider-testing
